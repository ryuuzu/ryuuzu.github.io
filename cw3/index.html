<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Puts a default character set for the whole webpage -->
    <meta charset="UTF-8">
    <!-- Provides support for old browsers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Author metadata -->
    <meta name="author" content="Utsav Gurmachhan Magar">
    <!-- Keywords for the search engine -->
    <meta name="keyword" content="Islington Coursework InformationSystems Coursework3">
    <!-- Helps to get the device width metadata -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links to the external CSS from the css folder -->
    <link rel="stylesheet" href="/cw3/css/style.css">
    <!-- For getting the fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Krona+One&family=Source+Code+Pro&family=Space+Mono&family=Poppins&family=Material+Icons&display=swap"
        rel="stylesheet">
    <!-- Title of the webpage -->
    <title>UGM - Home</title>
    <!-- Loads the script file from the js folder -->
    <script src="/cw3/js/main.js"></script>
    <!-- Internal CSS -->
    <style>
        .container {
            /* Aligns the text to the center */
            text-align: center;
        }

        .photo {
            /* Sets the width of the photo */
            width: 30%;
        }

        .lowerpm {
            /* Sets the padding for the lines */
            padding: 5px;
            /* Removes the margin */
            margin: 0;
            /* Makes the font into a monospace one */
            font-family: Space Mono, Source Code Pro, Consolas, monospace;
        }

        h3.lowerpm {
            /* Hides the age counter first */
            display: none;
            /* Sets the font size for the age counting */
            font-size: 20px;
        }

        /* Some basic responsiveness for the webpage on small screens */
        @media screen and (max-width: 900px) {
            .photo {
                width: 50%;
            }

            #line1 {
                font-size: 17px;
            }

            #line2 {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- The header of the webpage -->
    <header>
        <!-- The sticky top navigation bar -->
        <div class="mainNavBar">
            <!-- mainLogo that calls a rick roll when clicked on -->
            <h1 class="mainLogo" style="cursor: pointer;" onclick="playrr()">UGM</h1>
            <!-- menu icon that opens or closes the sidebar based on the parameter sent -->
            <h1 class="navOpener" id="openButton"><span class="material-icons" onclick="toggleNav('on')"
                    style="cursor: pointer;">menu</span></h1>
        </div>
        <!-- The actual navigation side bar -->
        <nav class="sideBar" id="sideBar">
            <!-- A close button to close the side bar after opening it -->
            <a href="javascript:void();" class="closeButton" onclick="toggleNav('off')"><span class="material-icons"
                    style="font-size: 30px;">close</span></a>
            <!-- Link to the respective pages -->
            <a href="#" class="active" onclick="toggleNav('off')">Home</a>
            <a href="/cw3/pages/blog.html">Blog</a>
            <a href="/cw3/pages/cv.html" onclick="toggleNav('off')">CV</a>
            <a href="/cw3/pages/contact.html" onclick="toggleNav('off')">Contact</a>
            <a href="/cw3/pages/research.html" onclick="toggleNav('off')">Research</a>
        </nav>
    </header>
    <!-- The main section of the webpage -->
    <main>
        <!-- Totally not a div that has a rick roll -->
        <div class="notarickroll" id="notarickroll">
            <h4 style="font-family: Krona One; color: black;">No Pausing the video! All you can do is reload now :v</h4>
            <!-- Video tag that sources the video file from the assests folder -->
            <video id="rr">
                <source src="/cw3/assets/epicvideo.mp4" type="video/mp4">
            </video><br>
            <!-- Link to the original Never Gonna Give You Up video <3 -->
            <a href=" https://www.youtube.com/watch?v=dQw4w9WgXcQ" style="font-family: Krona One;">Rick Astley ❤</a>
        </div>
        <!-- Div with the actually main contents of the webpage. -->
        <div class="container">
            <!-- Photo of me with a cat lol -->
            <figure><img src="/cw3/assets/photo.jpeg" alt="Utsav with a cat" class="photo"></figure>
            <!-- Introducing me. -->
            <h2 class="lowerpm" id="line1">Hello, I am Utsav Gurmachhan Magar. A student at Islington College, Nepal.
            </h2>
            <!-- An epic age counter of my exact birth date and time -->
            <h3 class="lowerpm" id="line2">I am <span id="age"></span> years old.</h3>
        </div>
    </main>
    <!-- The FOOTER of the webpage -->
    <footer class="footer">
        <a href="https://github.com/ryuuzu/">Utsav Gurmachhan Magar</a> 2021 &copy; All Rights Reserved
    </footer>

    <!-- Internal Script :D -->
    <script>
        // A function to display the age counting line on the HTML.
        function showNextLine() {
            document.getElementById('line2').style.display = "block";
        }

        // The age counter function
        function ageCounter() {
            // This stores a date object of my birth date and time.
            var bd = new Date(2002, 05, 22, 10, 55, 04);
            // This stores the current date and time as a date object.
            var d = new Date();
            // This calculates the different and converts it into years
            var diff = Math.abs(d - bd) / (1000 * 3600 * 24 * 365);
            // This makes sure the float value is fixed to 15 decimal places.
            var years = diff.toFixed(15);
            // This gets the place of the document where age is to be filled and fills it.
            document.getElementById('age').innerHTML = years;
            //This calls the function again and again every 10 milliseconds
            setTimeout(ageCounter, 10);
        }
        ageCounter(); //This calls the age counter function first
        showNextLine(); //And then the display function
    </script>
</body>

</html>
